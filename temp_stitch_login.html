<body class="bg-background text-on-background min-h-screen overflow-x-hidden">
<main class="flex min-h-screen w-full flex-col md:flex-row">
<!-- Left Side: Lifestyle Image (Full Bleed 50%) -->
<section class="relative w-full md:w-1/2 min-h-[40vh] md:min-h-screen">
<div class="absolute inset-0 bg-gradient-to-tr from-primary/20 to-secondary/20 mix-blend-multiply pointer-events-none z-10"></div>
<img alt="CandyStyle Lifestyle" class="absolute inset-0 w-full h-full object-cover" data-alt="A joyful, fashionable young woman laughing while wearing a vibrant, eclectic outfit consisting of a hot pink oversized blazer and pastel purple pleated skirt. She is posing in a brightly lit studio with a soft peach and lavender background that complements the playful CandyStyle aesthetic. The lighting is high-key and cheerful, emphasizing the high-saturation colors and bubbly personality of the brand identity. The entire scene radiates energy, fun, and modern street-style elegance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuARgCoMDMki2YuLLNAc0Xgx9p-fE4PE8bfrqso0C0o9Gn2JgR8bQzmyuNX1dTW0QETQrLSk_bsWl9cbPJ5ghR8nZYH4JSzehfmzDNdLlYsoqLMpXUymZhoVQDaRSS2jxioBAULs3ijQajfdAdHPk3C2v7sEkw2Ax4kPZ6t_wQh5s_p_XG-PnXQfFBN-KyqMpgzlvyipTTmUBZFIMMEKrxBcffO4GflyjArTFl5KbMfqSLz-Ah9LglHxKc2YVmutgt2Xg2QmqCHYg3-9">
<!-- Floating Brand Badge -->
<div class="absolute top-8 left-8 bg-surface/90 backdrop-blur-md px-6 py-3 rounded-lg shadow-lg flex items-center gap-2 z-20">
<span class="text-2xl font-black tracking-tighter text-primary">AlanysFashion</span>
</div>
<!-- Descriptive Overlay -->
<div class="absolute bottom-12 left-12 right-12 text-white drop-shadow-md z-20">
<h2 class="text-4xl md:text-5xl font-black mb-2 leading-tight">Style is a flavor.</h2>
<p class="text-lg md:text-xl font-medium opacity-95">Discover the sweetest collection of the season.</p>
</div>
</section>
<!-- Right Side: Login Form (Full Bleed 50%) -->
<section class="w-full md:w-1/2 flex items-center justify-center p-8 md:p-16 lg:p-24 bg-surface relative overflow-hidden">
<!-- Mobile Brand Logo (Small screen only) -->
<div class="md:hidden absolute top-8 left-8">
<span class="text-2xl font-black tracking-tighter text-primary">CandyStyle</span>
</div>
<div class="w-full max-w-md flex flex-col">
<!-- Welcoming Header -->
<header class="mb-10 text-center md:text-left">
<h1 class="text-4xl md:text-5xl font-black text-on-surface mb-3 tracking-tight">Welcome back, Sweetie!</h1>
<p class="text-on-surface-variant font-medium text-lg">Ready for the new season? Log in below.</p>
</header>
<!-- Login Form - No card container, sits directly on background -->
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-sm font-bold text-secondary px-2" for="email">Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary">mail</span>
<input class="w-full h-14 pl-14 pr-4 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 focus:bg-white transition-all text-on-surface placeholder:text-outline" id="email" placeholder="sugar@candystyle.com" type="email">
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-2">
<label class="text-sm font-bold text-secondary" for="password">Password</label>
<a class="text-xs font-bold text-tertiary hover:text-primary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary">lock</span>
<input class="w-full h-14 pl-14 pr-12 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary focus:ring-0 focus:bg-white transition-all text-on-surface placeholder:text-outline" id="password" placeholder="••••••••" type="password">
<button class="absolute right-5 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-white font-black text-lg rounded-lg shadow-lg shadow-primary/30 bouncy-spring flex items-center justify-center gap-2 mt-4" type="submit">
                    Login
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-12 flex items-center py-1">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-outline text-[10px] font-bold uppercase tracking-[0.2em]">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login Buttons -->
<div class="flex flex-col sm:flex-row gap-4 mb-10">
<button class="flex-1 h-14 rounded-lg border-2 border-surface-container-highest flex items-center justify-center gap-3 hover:bg-surface-container transition-colors bouncy-spring group">
<img alt="Google" class="w-6 h-6" data-alt="Official Google color logo icon centered on a white circular background representing a modern authentication option for digital services." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBycqwUjg2L2M7yf8ZQzqTtTEgSbphlunZ6qZMHf-jdM2RHNdCNSNTSKUJgzOB4b58hmHCAYYhpgoYRbHbXGaoKM2IGa46gQv5CiPvFtKFswDYW0w3brF2vViwv2E7x-Ep-FqVxbNaQrhEkdJUBbHI_raGmJEl5oYCJsIUBrlvBq1PuHUisv1K2ZLeJQ6zwayHoVAKppQB3S7vJOE7vuloYSl9PxIflYEITgGhoHQn9bv-w_QNKrhTnWA7vEXcaGS_rBoB_SX9r28Jr">
<span class="text-sm font-bold text-on-surface-variant group-hover:text-on-surface">Google</span>
</button>
<button class="flex-1 h-14 rounded-lg border-2 border-surface-container-highest flex items-center justify-center gap-3 hover:bg-surface-container transition-colors bouncy-spring group">
<img alt="Facebook" class="w-6 h-6" data-alt="Official Facebook color logo icon in its signature blue hue, representing a social media authentication provider for a modern web application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLfkmZpF0sGq12krCVqqq9ltUZUnMhzSLyO5ngB2PN-E0oS9JuMl4hBRuTXSQkDt-0uYaXGDsRXFBMkumCes7X7UU35Uhc_ElehQQo8fJwIFUvIPIRGsX2R_ueK14ANoTB6_n_rffV2nkgoADKyZZWO8HmK-KQe5K9aHVV2GE1UjziCdBVa208nEGca_N-KJ_A4nMNfBrwbseT4-dRnUrgv-JEy0L-51lyWxtTFqI3NfyXgjxtV0B4brmkYN6hCii92Yw3l7fGRqVE">
<span class="text-sm font-bold text-on-surface-variant group-hover:text-on-surface">Facebook</span>
</button>
</div>
<!-- Call to Action -->
<footer class="text-center md:text-left">
<p class="text-on-surface-variant font-medium">
                    New here? 
                    <a class="text-primary font-black hover:underline underline-offset-4 ml-1" href="#">Join the Club</a>
</p>
</footer>
</div>
</section>
</main>
<!-- Background Decorative Gradients -->
<div class="fixed top-0 left-1/2 -z-10 w-96 h-96 bg-primary-fixed/10 blur-[120px] rounded-full pointer-events-none"></div>
<div class="fixed bottom-0 right-0 -z-10 w-[30rem] h-[30rem] bg-tertiary-fixed/10 blur-[150px] rounded-full pointer-events-none"></div>
